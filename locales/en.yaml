# English — the source-of-truth catalog. Every other language file is an
# override of these keys; a key missing from a language renders English
# (server-side via go-i18n's base bundle, client-side via the merged
# /i18n dictionary).
#
# Rules:
# - Values are plain text. Never use `{{...}}` — go-i18n treats that as a
#   template action and Localize fails at request time.
# - Client-side placeholders use single braces ({name}, {date}, ...); the
#   JS swapper substitutes them in one pass.

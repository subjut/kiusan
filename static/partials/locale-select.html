<span class="locale-pick">
<label for="locale">{{.T "nav.language"}}:</label>
<select id="locale">
<option value=""{{if not .LocaleChosen}} selected{{end}}>{{.T "nav.browserDefault"}}</option>
{{range .LocaleOptions}}<option value="{{.Tag}}"{{if eq .Tag $.LocaleChosen}} selected{{end}}>{{.Name}}</option>
{{end}}
</select>
</span>

<div class="container">
	<form id="form" method="POST" action="/vote-form">
		{{if .VoteForm.VoteKey}}<input type="hidden" name="votekey" value="{{.VoteForm.VoteKey}}">{{end}}
		<h2 data-i18n="{{.VoteForm.FormTitleKey}}">{{.T .VoteForm.FormTitleKey}}</h2>
		<div class="form-field">
			<label for="title" data-i18n="form.title">{{.T "form.title"}}</label>
			<input type="text" id="title" name="title" value="{{.VoteForm.Title}}" maxlength="100">
			<span class="char-count" id="title-count"></span>
		</div>
		<div class="form-field">
			<label for="email" data-i18n="form.email">{{.T "form.email"}}</label>
			<input type="text" id="email" name="email" value="{{.VoteForm.Email}}" maxlength="256">
			<span class="char-count" id="email-count"></span>
		</div>
		<div class="form-field">
			<label for="description" data-i18n="form.description">{{.T "form.description"}}</label>
			<textarea id="description" name="description" rows="5" cols="40" maxlength="5000">{{.VoteForm.Description}}</textarea>
			<span class="char-count" id="description-count"></span>
		</div>
		<div class="form-field">
			<input type="checkbox" id="hide-users" name="hide-users" value="true"{{if .VoteForm.HideUsers}} checked{{end}}>
			<label for="hide-users" data-i18n="form.hideUsers">{{.T "form.hideUsers"}}</label>
		</div>
		<div class="form-field">
			<input type="checkbox" id="single-choice" name="single-choice" value="true"{{if .VoteForm.SingleChoice}} checked{{end}}{{if .VoteForm.MustAnswer}} disabled{{end}}>
			<label for="single-choice" data-i18n="form.singleChoice">{{.T "form.singleChoice"}}</label>
			<p class="form-note" id="single-choice-note" hidden data-i18n="form.singleChoiceNote">{{.T "form.singleChoiceNote"}}</p>
			{{if .VoteForm.VoteKey}}
			<p class="form-note wipe-warn" id="single-choice-warn" hidden data-i18n="form.singleChoiceWipes">{{.T "form.singleChoiceWipes"}}</p>
			{{end}}
		</div>
		<div class="form-field">
			<input type="checkbox" id="must-answer" name="must-answer" value="true"{{if .VoteForm.MustAnswer}} checked{{end}}{{if .VoteForm.SingleChoice}} disabled{{end}}>
			<label for="must-answer" data-i18n="form.mustAnswer">{{.T "form.mustAnswer"}}</label>
			<p class="form-note" id="must-answer-note" hidden data-i18n="form.mustAnswerNote">{{.T "form.mustAnswerNote"}}</p>
		</div>
		<fieldset class="vote-type-picker">
			<legend data-i18n="form.voteType">{{.T "form.voteType"}}</legend>
			<label class="vote-type-option" for="votetype-yes">
				<input type="radio" id="votetype-yes" name="votetype" value="yes"{{if eq .VoteForm.VoteType "yes"}} checked{{end}}{{if .VoteForm.MustAnswer}} disabled{{end}}>
				<span data-i18n="form.voteTypeYes">{{.T "form.voteTypeYes"}}</span>
			</label>
			<label class="vote-type-option" for="votetype-yes-no">
				<input type="radio" id="votetype-yes-no" name="votetype" value="yes-no"{{if eq .VoteForm.VoteType "yes-no"}} checked{{end}}{{if .VoteForm.SingleChoice}} disabled{{end}}>
				<span data-i18n="form.voteTypeYesNo">{{.T "form.voteTypeYesNo"}}</span>
			</label>
			<label class="vote-type-option" for="votetype-yes-maybe-no">
				<input type="radio" id="votetype-yes-maybe-no" name="votetype" value="yes-maybe-no"{{if eq .VoteForm.VoteType "yes-maybe-no"}} checked{{end}}{{if .VoteForm.SingleChoice}} disabled{{end}}>
				<span data-i18n="form.voteTypeYesMaybeNo">{{.T "form.voteTypeYesMaybeNo"}}</span>
			</label>
			<label class="vote-type-option" for="votetype-freetext">
				<input type="radio" id="votetype-freetext" name="votetype" value="freetext"{{if eq .VoteForm.VoteType "freetext"}} checked{{end}}>
				<span data-i18n="form.voteTypeFreeText">{{.T "form.voteTypeFreeText"}}</span>
			</label>
		</fieldset>
		<div class="form-rows">
			<div class="form-field">
				<label for="enddate" data-i18n="form.endDate">{{.T "form.endDate"}}</label>
				<input type="date" id="enddate" name="enddate" min="{{.VoteForm.MinExp}}" value="{{if .VoteForm.Expiry}}{{.VoteForm.Expiry}}{{else}}{{.VoteForm.DefaultExp}}{{end}}">
			</div>
		</div>

		<fieldset class="choices-picker">
			<legend data-i18n="form.options">{{.T "form.options"}}</legend>
			<div id="choice-rows">
				{{range $i, $c := .VoteForm.Choices}}
				<div class="choice-row">
					<input type="hidden" name="choiceID{{ $i }}" value="{{ $c.ID }}">
					<input type="text" name="choice{{ $i }}" value="{{ $c.Text }}" maxlength="100" required>
					<button type="button" class="choice-remove" data-i18n-title="form.removeOption" title="{{ $.T "form.removeOption" }}" aria-label="{{ $.T "form.removeOption" }}">&times;</button>
				</div>
				{{else}}
				<div class="choice-row">
					<input type="text" name="choice0" maxlength="100" required>
					<button type="button" class="choice-remove" data-i18n-title="form.removeOption" title="{{.T "form.removeOption" }}" aria-label="{{.T "form.removeOption" }}">&times;</button>
				</div>
				{{end}}
			</div>
			<button type="button" class="btn-secondary" id="add-choice" data-i18n="form.addOption">{{.T "form.addOption"}}</button>
			<span class="choice-count" id="choice-count"></span>
		</fieldset>

		<input type="submit" value="{{.VoteForm.SubmitLabel}}">
	</form>
	<script src="/chooser.js"></script>
</div>

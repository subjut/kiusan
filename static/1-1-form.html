<div class="container">
	<form id="form" method="POST">
		<label for="title">Title:</label><br>
		<input type="text" id="title" name="title"><br>
		<label for="email">Email:</label><br>
		<input type="text" id="email" name="email"><br>
		<label for="description">Description:</label><br>
		<textarea id="description" name="description" rows="5" cols="40"></textarea><br>
		<input type="checkbox" id="hide-users" name="HideUsers" value="hide-users">
		<label for="hide-users">Respondents can't see each others answers</label><br>
		<input type="checkbox" id="single-signup" name="SingleSignup" value="single-signup">
		<label for="single-signup">People can only sign up to one time slot</label><br>
		<br>

		<label for="timezone">Timezone:</label>
		<select id="timezone" name="timezone">
{{range .timezones}}<option value="{{.}}">{{.}}</option>
{{end}}</select><br><br>

		<fieldset class="dates-picker">
			<legend>Select date(s)</legend>
			<div class="cal-nav">
				<button type="button" id="cal-prev" aria-label="Previous month">‹</button>
				<span class="cal-title" id="cal-title"></span>
				<button type="button" id="cal-next" aria-label="Next month">›</button>
			</div>
			<table class="cal-grid" id="cal-grid"></table>
			<div class="chips" id="date-chips"></div>
			<button type="button" class="clear-btn" id="clear-dates">Clear all dates</button>
		</fieldset>

		<fieldset class="times-picker">
			<legend>Time(s</legend>) — applied to all selected dates</legend>
			<input type="time" id="time-input">
			<button type="button" id="add-time">Add time</button>
			<div class="chips" id="time-chips"></div>
			<button type="button" class="clear-btn" id="clear-times">Clear all times</button>
		</fieldset>

		<div id="slot-preview"></div>

		<input type="submit" value="submit">
	</form>
	<script src="./dater.js"></script>
</div>

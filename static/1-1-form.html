<div class="container">
	<form id="form" method="POST">
		<label for="title">Title:</label><br>
		<input type="text" id="title" name="title"><br>
		<label for="email">Email:</label><br>
		<input type="text" id="1-email" name="email"><br>
		<label for="description">Description:</label><br>
		<textarea id="description" name="description" rows="5" cols="40"></textarea><br>
		<input type="checkbox" id="hide-users" name="HideUsers" value="hide-users">
		<label for="hide-users">Respondents can't see each others answers</label><br>
		<input type="checkbox" id="single-signup" name="SingleSignup" value="single-signup">
		<label for="single-signup">People can only sign up to one time slot</label><br>
		<label>
			Select date(s):
			<input type="date" name="date0" min="{{.today}}" required>
			<span class="validity"></span>
		</label><br>
	</form>
	<button onclick="add_date()">Add date</button><br><br>
	<input type="submit" value="submit">
	
	<script>
		 function add_date(){

			var x = document.getElementById("form");
			// create an input field to insert
			var new_date = document.createElement("input");
			// set input field data type to text
			new_date.setAttribute("type", "date");
			// set input field name
			for (i = 0;; i++) {
				if (document.getElementsByName("date" + i).length == 0) {
					new_date.setAttribute("name", "date" + i);
					break;
				}
			}
			// select last position to insert element before it
			//var pos = x.childElementCount;
			// insert element
			x.appendChild(new_date);
		 }
		</script>
</div>

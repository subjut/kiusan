<div class="container">
	<form id="form" method="POST" action="/choice-form">
		{{if .VoteKey}}<input type="hidden" name="votekey" value="{{.VoteKey}}">{{end}}
		<h2 data-i18n="{{.FormTitleKey}}">{{.T .FormTitleKey}}</h2>
		<label for="title" data-i18n="form.title">{{.T "form.title"}}</label><br>
		<input type="text" id="title" name="title" value="{{.Title}}" maxlength="100">
			<span class="char-count" id="title-count"></span><br>
		<label for="email" data-i18n="form.email">{{.T "form.email"}}</label><br>
		<input type="text" id="email" name="email" value="{{.Email}}" maxlength="320">
			<span class="char-count" id="email-count"></span><br>
		<label for="description" data-i18n="form.description">{{.T "form.description"}}</label><br>
		<textarea id="description" name="description" rows="5" cols="40" maxlength="5000">{{.Description}}</textarea>
			<span class="char-count" id="description-count"></span><br>
		<input type="checkbox" id="hide-users" name="hide-users" value="true"{{if .HideUsers}} checked{{end}}>
		<label for="hide-users" data-i18n="form.hideUsers">{{.T "form.hideUsers"}}</label><br>
		<input type="checkbox" id="single-choice" name="single-choice" value="true"{{if .SingleChoice}} checked{{end}}>
		<label for="single-choice" data-i18n="form.singleChoice">{{.T "form.singleChoice"}}</label><br>
		<p class="form-note" id="single-choice-note" hidden data-i18n="form.singleChoiceNote">{{.T "form.singleChoiceNote"}}</p>
		<input type="checkbox" id="free-text" name="free-text" value="true"{{if .FreeText}} checked{{end}}>
		<label for="free-text" data-i18n="form.freeText">{{.T "form.freeText"}}</label><br>
		<label for="enddate" data-i18n="form.endDate">{{.T "form.endDate"}}</label>
		<input type="date" id="enddate" name="enddate" min="{{.MinExp}}" value="{{if .Expiry}}{{.Expiry}}{{else}}{{.DefaultExp}}{{end}}"><br>
		<br>

		<fieldset class="choices-picker">
			<legend data-i18n="form.options">{{.T "form.options"}}</legend>
			<div id="choice-rows">
				{{range $i, $c := .Choices}}
				<div class="choice-row">
					<input type="hidden" name="choiceID{{ $i }}" value="{{ $c.ID }}">
					<input type="text" name="choice{{ $i }}" value="{{ $c.Text }}" maxlength="100" required>
					<button type="button" class="choice-remove" data-i18n-title="form.removeOption" title="{{ $.T "form.removeOption" }}" aria-label="{{ $.T "form.removeOption" }}">&times;</button>
				</div>
				{{else}}
				<div class="choice-row">
					<input type="text" name="choice0" maxlength="100" required>
					<button type="button" class="choice-remove" data-i18n-title="form.removeOption" title="{{.T "form.removeOption" }}" aria-label="{{.T "form.removeOption" }}">&times;</button>
				</div>
				{{end}}
			</div>
			<button type="button" class="btn-secondary" id="add-choice" data-i18n="form.addOption">{{.T "form.addOption"}}</button>
			<span class="choice-count" id="choice-count"></span>
		</fieldset>

		<input type="submit" value="{{.SubmitLabel}}">
	</form>
	<script src="/chooser.js"></script>
</div>

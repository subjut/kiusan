{{/* The 404 for a poll link that resolves to nothing — the poll was
     deleted (or the key was never valid). Rendered with status 404 by
     meetingGone; the plain-text 404 is kept for unknown paths. */}}
<div class="container">
	<h2 data-i18n="meet.goneTitle">{{.T "meet.goneTitle"}}</h2>
	<p class="meta" data-i18n="meet.goneText">{{.T "meet.goneText"}}</p>
	<p><a class="btn" href="/" data-i18n="meet.goneHome">{{.T "meet.goneHome"}}</a></p>
</div>

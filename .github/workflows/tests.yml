name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      # SQLite-only for now: the in-process suites run on GORM-sqlite
      - name: Test (race + coverage)
        run: |
          go test -race -coverprofile=coverage.out $(go list ./... | grep -v '/tools/')
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "total coverage: ${total}"
          # Fail if the overall coverage falls below the floor of 80%.
          # ./tools are excluded above.
          awk -v c="${total}" 'BEGIN { if (c+0 < 80.0) { printf "coverage %s%% is below the 80%% floor\n", c; exit 1 } }'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.out

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check the page scripts
        run: |
          for f in static/js/*.js; do node --check "$f"; done
      - name: Run the JS test suite
        run: npm --prefix jstest install && npm --prefix jstest test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Playwright + Chromium
        run: npm --prefix e2e install && npx --prefix e2e playwright install --with-deps chromium
      # The suite starts its own server (seeded throwaway data dir) — see
      # e2e/playwright.config.mjs.
      - name: Run the E2E suite
        run: npm --prefix e2e test
